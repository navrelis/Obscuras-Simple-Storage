plugins {
	id 'fabric-loom' version '1.9-SNAPSHOT'
	id 'maven-publish'
}

repositories {
	maven { url = 'https://jitpack.io' }
	maven { url = "https://maven.shedaniel.me/" }
	maven { url = "https://maven.terraformersmc.com/releases/"}
	maven { url = "https://maven.architectury.dev/" }
	maven {
		name = "Ladysnake Libs"
		url = 'https://maven.ladysnake.org/releases'
	}
	maven {
	    // location of the maven that hosts JEI files since January 2023
	    name = "Jared's maven"
	    url = "https://maven.blamejared.com/"
	}
	maven {
        url = 'https://www.cursemaven.com'
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
    	// location of a maven mirror for JEI files, as a fallback
    	name = "ModMaven"
    	url = "https://modmaven.dev"
	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

base {
	archivesName = project.archives_base_name
}
version = project.mod_version
group = project.maven_group

def useLib = System.getProperty("useLib")

dependencies {
	//to change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	
	modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    include "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
	
	modImplementation("com.terraformersmc:modmenu:11.0.1") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    
    modImplementation include("org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cardinal_components_version}")
    modImplementation include("org.ladysnake.cardinal-components-api:cardinal-components-block:${project.cardinal_components_version}")
	modImplementation include("org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cardinal_components_version}")
	implementation 'com.google.code.findbugs:jsr305:3.0.2'
	
	// compile against the JEI API but do not include it at runtime
	modCompileOnlyApi("mezz.jei:jei-1.21.1-common-api:${project.jei_version}")
	modCompileOnlyApi("mezz.jei:jei-1.21.1-fabric-api:${project.jei_version}")
	// at runtime, use the full JEI jar for Fabric
	modRuntimeOnly("mezz.jei:jei-1.21.1-fabric:${project.jei_version}")
	
	modImplementation "curse.maven:polymorph-388800:5995378"
	
	modImplementation ("curse.maven:jade-324717:5493289")
	
	modImplementation "dev.emi:trinkets:3.10.0"
	
	modCompileOnly("me.shedaniel:RoughlyEnoughItems-api:${project.rei_version}"){
		exclude(group: "net.fabricmc.fabric-api")
	    exclude(group: "me.shedaniel.cloth")
	    exclude(group: "dev.architectury")
	}
	modCompileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin:${project.rei_version}") {
	   exclude(group: "net.fabricmc.fabric-api")
	   exclude(group: "me.shedaniel.cloth")
	   exclude(group: "dev.architectury")
	}
	modRuntimeOnly("me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"){
	    exclude(group: "net.fabricmc.fabric-api")
	    exclude(group: "me.shedaniel.cloth")
	    exclude(group: "dev.architectury")
	}
	modImplementation("dev.architectury:architectury-fabric:13.0.6")
	
	// Sodium 0.5.x (no Fabric Rendering API), compile-only for the SodiumBlockRendererMixin target
	modCompileOnly "maven.modrinth:sodium:mc1.21-0.5.11"

	modCompileOnly  "dev.emi:emi-fabric:${project.emi_version}:api"
	modLocalRuntime "dev.emi:emi-fabric:${project.emi_version}"
	
	if(useLib) {
		modCompileOnly "curse.maven:vivecraft-667903:6063962"
	} else {
		compileOnly files("libs/vc_dummy.jar")
	}

	// Unit test wiring (test-only)
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testImplementation "org.mockito:mockito-core:5.14.2"
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "failed", "skipped"
		showStandardStreams = true
		exceptionFormat = "full"
	}
}

// Loader-agnostic code and assets live in ../Common-1.21.1 (shared with the NeoForge build). This
// project's own src/main only holds the Fabric platform classes (same class names as their NeoForge
// twins), fabric.mod.json, the access widener, the mixins and Fabric-only data.
def commonDir = file("../Common-1.21.1/src/main")

sourceSets {
	main {
		java {
			srcDir new File(commonDir, "java")
		}
		resources {
			srcDir new File(commonDir, "resources")
		}
	}
}

// In-world GameTests (Fabric GameTest API, part of the bundled Fabric API). A separate source set
// with its own fabric.mod.json (entrypoint "fabric-gametest"), so none of it ends up in the release
// jar, which is built from the main source set only. Run: gradlew runGametest
sourceSets {
	gametest {
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
	}
}

loom {
	accessWidenerPath = file("src/main/resources/obscuras_storage.accesswidener")

	mods {
		obscuras_storage {
			sourceSet sourceSets.main
		}
		obscuras_storage_gametest {
			sourceSet sourceSets.gametest
		}
	}

	runs {
		// Loom 1.9 has no fabricApi.configureTests (added in 1.10), so the headless test server is a
		// plain server run: -Dfabric-api.gametest makes Fabric API start the vanilla GameTestServer,
		// which runs every registered test and exits with the number of failed required tests,
		// so a failing test fails the runGametest task.
		gametest {
			server()
			name "Game Test"
			source sourceSets.gametest
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/gametest/junit.xml"
			runDir "build/gametest"
			ideConfigGenerated false
		}
	}
}

// Every run starts from a fresh test world
tasks.matching { it.name == 'runGametest' }.configureEach {
	group = 'verification'
	description = 'Runs the in-world GameTests on a headless server, fails when a test fails.'
	doFirst {
		delete file("build/gametest/world")
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

// The MIT license text (with its copyright notices) ships at the root of the jar.
jar {
	from("../LICENSE")
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			// add all the jars that should be included when publishing to maven
			artifact(remapJar) {
				builtBy remapJar
			}
			artifact(sourcesJar) {
				builtBy remapSourcesJar
			}
		}
	}

	// select the repositories you want to publish to
	repositories {
		// uncomment to publish to the local maven
		// mavenLocal()
		def mavenURL = System.getProperty("mavenDir")
		if ("${mavenURL}" != "null") {
			maven {
				url = file(mavenURL)
			}
		}
	}
}
